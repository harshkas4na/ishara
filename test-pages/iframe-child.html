<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embedded signup form</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;padding:14px;font:14px/1.5 system-ui,sans-serif;background:#fff;color:#212529}
 h2{margin:0 0 8px;font-size:16px}
 label{display:block;font-weight:600;margin:10px 0 3px}
 input{width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid #ced4da;border-radius:6px;font:inherit}
 button{margin-top:14px;padding:8px 16px;border-radius:6px;border:1px solid #0784c3;background:#0784c3;color:#fff;font:inherit;cursor:pointer}
</style></head>
<body>
 <h2>Join the waitlist</h2>
 <form onsubmit="return false">
  <label for="n">Full name</label><input id="n" type="text" placeholder="Ada Lovelace">
  <label for="e">Email address</label><input id="e" type="email" placeholder="you@example.com">
  <button type="submit">Join waitlist</button>
 </form>
<script>
 // ?v=b gives the second copy different labels, so a question can name exactly one of the two embedded forms.
 if (location.search.includes("v=b")) { n.previousElementSibling.textContent = "Company name"; e.previousElementSibling.textContent = "Work email"; document.querySelector("h2").textContent = "Request a demo"; document.querySelector("button").textContent = "Request demo"; }
</script></body></html>
