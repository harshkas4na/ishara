<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Iframe demo | Ishara</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{margin:0;font:14px/1.5 system-ui,sans-serif;color:#212529;background:#f8f9fa}
 main{max-width:760px;margin:24px auto;padding:0 16px}
 h1{font-size:20px}
 .card{background:#fff;border:1px solid #e7eaf3;border-radius:8px;padding:16px;margin:16px 0}
 iframe{width:100%;height:270px;border:2px solid #6d28d9;border-radius:6px;padding:4px;box-sizing:border-box}
 a.top{color:#0784c3}
</style></head>
<body><main>
 <h1>Pages inside pages</h1>
 <p>Two embedded forms. Ishara should see a control inside each. <a class="top" href="#">A link on the parent page</a></p>
 <div class="card"><b>A. Same origin</b> (127.0.0.1:7777)
  <iframe id="same" src="iframe-child.html" title="same-origin form"></iframe></div>
 <div class="card"><b>B. Cross origin</b> (localhost:7777, a different origin from 127.0.0.1:7777; needs the helper running)
  <iframe id="cross" src="http://localhost:7777/test/iframe-child.html?v=b" title="cross-origin form"></iframe></div>
 <button type="button">A parent page button</button>
</main></body></html>
